
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <title>Home | ICT 10 Student Showcase</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-image: url(https://i.pinimg.com/736x/a3/8e/a5/a38ea5865e40f9d0ffea45b34a95af37.jpg);
            color: #333;
        }

        header {
            background-color: #301044;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        header h1 {
            margin-bottom: 10px;
        }

        nav {
            background-color: #301044;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
            font-weight: bold;
            font-size: 14px;
        }

        nav a:hover {
            color: #D9B8F0;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 12px #00000020;
        }

        h2 {
            color: #4B2068;
            margin-bottom: 15px;
            text-align: center;
        }

        .intro {
            text-align: center;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .checker {
            background-color: #E9DDF2;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            border-left: 5px solid #4B2068;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        button {
            background-color: #4B2068;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }

        button:hover {
            background-color: #301044;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            line-height: 1.6;
        }

        footer {
            background-color: #301044;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 40px;
        }

        @media screen and (max-width: 600px) {
            nav a {
                display: inline-block;
                margin: 7px;
            }

            .container {
                margin: 20px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>ICT 10 Student Showcase 2026</h1>
    </header>

    <nav>
        <a href="index.html">Homepage</a>
        <a href="element_checker.html">Element Checker</a>
        <a href="club_members.html">School Club Members</a>
        <a href="meet_the_creator.html">Meet the Creator</a>
    </nav>

    <div class="container">

        <h2>Welcome to My Website!</h2>

        <div class="checker">

            <h2>OBFV Volleyball Varsity Checker</h2>

            <p>
                Enter your first and last name to check if you are part
                of the OBFV Volleyball Varsity.
            </p>

            <br>

            <input type="text" id="first_name" placeholder="Enter your first name">
            <input type="text" id="last_name" placeholder="Enter your last name">
            <button py-click="verify_candidate">Check Member</button>

            <div id="result"></div>
        </div>
    </div>

     <br><br>

    <footer>
        <p>Made by Kailey Gayas | ICT 10 Student Showcase 2026</p>
    </footer>
    <py-script src="main.py"></py-script>

</body>
</html>
